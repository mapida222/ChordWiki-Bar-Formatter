<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChordWiki-Bar-Formatter UI 比較</title>
  <style>
    :root{color-scheme:light;--bg:#eef1f5;--ink:#18212b;--muted:#647180;--line:#d5dce5;--panel:#fff;--accent:#2f6fed}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}
    header{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:18px 24px;display:flex;justify-content:space-between;align-items:end;gap:16px}
    h1{font-size:20px;margin:0 0 4px}p{margin:0;color:var(--muted);font-size:13px}
    main{padding:24px;display:grid;grid-template-columns:minmax(760px,1fr) 430px;gap:24px;align-items:start}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 26px rgba(27,43,65,.08);overflow:hidden}
    .card-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
    .card-head strong{font-size:14px}.badge{font:600 11px/1 system-ui;color:var(--accent);background:#eaf0ff;padding:6px 8px;border-radius:999px}
    .frame-wrap{padding:18px;background:#dfe5ec;display:flex;justify-content:center}.frame{background:#fff;border:1px solid #aeb8c5;box-shadow:0 4px 14px rgba(0,0,0,.12);overflow:hidden}
    .pc .frame{width:min(1280px,100%);height:820px}.mobile .frame{width:390px;height:844px;border-radius:22px}iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .note{padding:12px 16px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
    @media (max-width:1100px){main{grid-template-columns:1fr}.mobile{max-width:480px}}
  </style>
</head>
<body>
  <header><div><h1>ChordWiki-Bar-Formatter UI 比較</h1><p>現在のビルドを同一条件で表示 — 機能変更なし / 見た目の確認用</p></div><p>PC 1280 × 820　｜　スマホ 390 × 844</p></header>
  <main>
    <section class="card pc"><div class="card-head"><strong>PC版</strong><span class="badge">1280px viewport</span></div><div class="frame-wrap"><div class="frame"><iframe title="PC版の現在UI" src="./dist/index.html"></iframe></div></div><div class="note">横幅のある画面で、ヘッダー・入力・プレビューの配置を確認。</div></section>
    <section class="card mobile"><div class="card-head"><strong>スマホ版</strong><span class="badge">390px viewport</span></div><div class="frame-wrap"><div class="frame"><iframe title="スマホ版の現在UI" src="./dist/index.html"></iframe></div></div><div class="note">スマホ幅での折り返し、縦積み、操作領域を確認。</div></section>
  </main>
</body>
</html>
